<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAM Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="background-glow"></div>
    <div id="weather-layer"></div>
    <main class="container">
        <header>
            <h1><span class="highlight">MET</span>AM</h1>
            <p>Next-Gen Aviation Weather Interface</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="icao-input" placeholder="Enter ICAO codes (e.g. VABB KLAX)" autocomplete="off">
                <button id="search-btn">FETCH</button>
            </div>
        </section>

        <section id="results" class="results-container">
            <div class="loader" id="loader"></div>
            <div id="weather-cards" class="cards-grid"></div>
        </section>
    </main>

    <script>
        const input = document.getElementById('icao-input');
        const btn = document.getElementById('search-btn');
        const cardsGrid = document.getElementById('weather-cards');
        const loader = document.getElementById('loader');

        function createCard(data) {
            const blocks = data.split('### 📍');
            cardsGrid.innerHTML = '';
            
            blocks.forEach(block => {
                if(!block.trim()) return;
                const lines = block.split('\n');
                const headerText = lines[0].replace(/\*\*/g, '').trim();
                const parts = headerText.split('|').map(p => p.trim());
                
                const stationId = parts[0];
                const extraInfo = parts.slice(1).join(' <span class="separator">|</span> ');
                
                const card = document.createElement('div');
                card.className = 'weather-card';
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="header-main">
                            <span class="station-id">${stationId}</span>
                            <span class="station-meta">${extraInfo}</span>
                        </div>
                        <div class="status-badge">LIVE</div>
                    </div>
                    <div class="card-content">
                        ${marked.parse(block.replace(headerText, ''))}
                    </div>
                `;
                cardsGrid.appendChild(card);
            });
        }

        async function fetchWeather() {
            const query = input.value.trim();
            if(!query) return;

            cardsGrid.innerHTML = '';
            loader.style.display = 'block';
            
            try {
                const response = await fetch(`/api/weather?stations=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                loader.style.display = 'none';
                createCard(data.text);
                
                // Dynamic Weather Animations
                const textRaw = data.text.toLowerCase();
                document.body.className = '';
                
                if (textRaw.includes('thunderstorm')) document.body.className = 'weather-thunder';
                else if (textRaw.includes('rain')) document.body.className = 'weather-rain';
                else if (textRaw.includes('snow')) document.body.className = 'weather-snow';
                else if (textRaw.includes('gust')) document.body.className = 'weather-windy';
                else document.body.className = 'weather-clear';
                
            } catch (err) {
                loader.style.display = 'none';
                cardsGrid.innerHTML = `<p class="error">System Error: Datalink Timeout.</p>`;
            }
        }

        btn.addEventListener('click', fetchWeather);
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') fetchWeather(); });
    </script>
</body>
</html>
