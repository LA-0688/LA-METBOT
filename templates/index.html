<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAM Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="background-glow"></div>
    <div id="weather-layer">
        <div class="layer-clouds"></div>
        <div class="layer-rain-far"></div>
        <div class="layer-rain-near"></div>
        <div class="layer-lightning"></div>
    </div>
    <main class="container">
        <header>
            <div class="header-main-brand" id="brand-container">
                <h1 id="main-title">
                    <span id="title-icon-left" class="brand-icon"></span>
                    <span class="highlight">MET</span>AM
                    <span id="title-icon-right" class="brand-icon"></span>
                </h1>
                <div id="utc-clock" class="utc-clock">--:--:-- UTC</div>
                <div id="location-tag" class="location-tag">Detecting Local Uplink...</div>
            </div>
            <p class="tagline">Aviation Weather Interface</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="icao-input" placeholder="Enter ICAO codes (e.g. VABB KLAX)" autocomplete="off">
                <button id="search-btn">FETCH</button>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </section>

        <section id="results" class="results-container">
            <div class="loader" id="loader"></div>
            <div id="weather-cards" class="cards-grid"></div>
        </section>
    </main>

    <script>
        const input = document.getElementById('icao-input');
        const btn = document.getElementById('search-btn');
        const cardsGrid = document.getElementById('weather-cards');
        const loader = document.getElementById('loader');

        function createCard(data) {
            const blocks = data.split('### 📍');
            cardsGrid.innerHTML = '';
            
            blocks.forEach((block, index) => {
                if(!block.trim()) return;
                const lines = block.split('\n');
                const headerText = lines[0].trim();
                const cleanHeader = headerText.replace(/\*\*/g, '');
                const parts = cleanHeader.split('|').map(p => p.trim());
                
                const stationId = parts[0];
                const airportName = parts[1] || '';
                const extraInfo = parts.slice(2).join(' <span class="separator">|</span> ');
                
                const card = document.createElement('div');
                card.className = 'weather-card';
                const cardId = `card-${index}`;
                
                const rawContent = [];
                const decodedContent = [];
                let isInsideRaw = false;

                // Simple parser to separate Raw vs Decoded
                // We'll look for blocks of code (METAR) or italicized lines (TAF)
                const fullText = block.replace(headerText, '').trim();
                
                // Extract METAR elapsed time (e.g., "45m ago")
                const metarTimeMatch = fullText.match(/✈️ \*METAR\* \((.*?)\)/);
                const metarTime = metarTimeMatch ? metarTimeMatch[1] : '';
                
                const parsedHTML = marked.parse(fullText);
                
                function highlightThreats(metar) {
                    const criticalCodes = [
                        'TS', 'RA', 'SN', 'FZ', 'WS', 'SQ', 'FC', 'SS', 'DS', 'VA', 'FG', 'BLDU'
                    ];
                    // 1. Highlight Weather Phenomenon (TS, FG, etc.)
                    // Updated to ensure it doesn't gobble up station IDs like VABB (matching VA + BB)
                    // We only allow known weather suffixes or standalone codes
                    const phenomRegex = new RegExp(`\\b([+-]?(?:${criticalCodes.join('|')})(?:RA|SN|DZ|FG|BR|HZ|FU|DU|GR|GS|PL|SG|IC|UP|VA|PO|SQ|FC|SS|DS)?)\\b`, 'g');
                    let highlighted = metar.replace(phenomRegex, (match) => {
                        // Avoid matching common 4-letter ICAO station prefixes if they don't look like weather
                        if (match.length === 4 && /^(V|K|E|P|O|R|S|U|Z)/.test(match) && !/TS|RA|SN|FG|BR/.test(match)) {
                           return match;
                        }
                        return `<span class="metar-threat">${match}</span>`;
                    });
                    
                    // 2. Highlight Low Visibility (ICAO 4-digit below 1000m)
                    const visRegex = /\b(0\d{3})(?![Z])\b/g;
                    highlighted = highlighted.replace(visRegex, '<span class="metar-threat">$1</span>');

                    // 3. Highlight High/Gusty Winds (e.g., G20KT or speeds 10KT+)
                    // Matches wind blocks like 25010G15KT or 25012KT
                    const windRegex = /\b(\d{3}(?:[1-9]\d)G?\d{0,2}KT)\b/g;
                    highlighted = highlighted.replace(windRegex, '<span class="metar-threat">$1</span>');
                    
                    // Also catch standalone gusts if they occur
                    const gustRegex = /\bG\d{2,3}KT\b/g;
                    highlighted = highlighted.replace(gustRegex, '<span class="metar-threat">$1</span>');
                    
                    return highlighted;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="header-main">
                            <div class="station-block">
                                <span class="station-id">${stationId}</span>
                                <span class="airport-name">${airportName}</span>
                            </div>
                            <span class="station-meta">${extraInfo}</span>
                        </div>
                        <div class="view-toggle">
                            <span class="toggle-label raw-label">Raw</span>
                            <label class="switch">
                                <input type="checkbox" onchange="this.closest('.weather-card').classList.toggle('show-decoded')">
                                <span class="slider"></span>
                            </label>
                            <span class="toggle-label decoded-label">Decoded</span>
                        </div>
                    </div>
                    <div class="card-content">
                        <div class="raw-view">
                            <div class="metar-block">
                                <div class="metar-time-label" style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.3rem; font-family: 'JetBrains Mono', monospace;">METAR ${metarTime ? `(${metarTime})` : ''}</div>
                                ${(parsedHTML.match(/<code>[\s\S]*?<\/code>/g) || []).map(code => highlightThreats(code)).join('<br>')}
                            </div>
                            <div class="taf-block" style="margin-top: 0.5rem;">
                                ${(parsedHTML.match(/<em>.*?TAF.*?<\/em>/g) || []).map(taf => highlightThreats(taf)).join('<br>')}
                            </div>
                        </div>
                        <div class="decoded-view">
                            ${parsedHTML.replace(/<code>[\s\S]*?<\/code>/g, '').replace(/<em>.*?TAF.*?<\/em>/g, '')}
                        </div>
                    </div>
                `;
                cardsGrid.appendChild(card);
            });
        }

        // UTC Clock & Dynamic Title Logic
        function updateClockAndIcons() {
            const now = new Date();
            const hours = now.getUTCHours();
            const utc = now.toISOString().split('T')[1].split('.')[0] + ' UTC';
            document.getElementById('utc-clock').textContent = utc;

            const iconLeft = document.getElementById('title-icon-left');
            const iconRight = document.getElementById('title-icon-right');
            const title = document.getElementById('main-title');

            // Time of day logic
            if (hours >= 5 && hours < 11) {
                iconLeft.textContent = '🌅'; // Sunrise
                iconRight.textContent = '☁️';
            } else if (hours >= 11 && hours < 17) {
                iconLeft.textContent = '☀️'; // Noon
                iconRight.textContent = '🌤️';
            } else if (hours >= 17 && hours < 20) {
                iconLeft.textContent = '🌇'; // Sunset
                iconRight.textContent = '🌆';
            } else {
                iconLeft.textContent = '🌙'; // Night
                iconRight.textContent = '✨';
            }
        }
        setInterval(updateClockAndIcons, 1000);
        updateClockAndIcons();

        // Location & Local Time Detection
        async function detectLocation() {
            const tag = document.getElementById('location-tag');
            
            // Try HTML5 Geolocation first (more accurate, bypasses VPN)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const resp = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                        const data = await resp.json();
                        const city = data.city || data.locality || "Unknown";
                        const country = data.countryCode || "??";
                        setupClock(city, country);
                    } catch (err) {
                        fallbackToIP();
                    }
                }, (err) => {
                    // Fallback if user denies or it fails
                    fallbackToIP();
                }, { timeout: 5000 });
            } else {
                fallbackToIP();
            }

            async function fallbackToIP() {
                try {
                    const resp = await fetch('https://ipapi.co/json/');
                    const data = await resp.json();
                    setupClock(data.city, data.country_code);
                } catch (err) {
                    tag.textContent = 'CURRENT LOCATION: OFFLINE';
                }
            }

            function setupClock(city, country) {
                function updateLocalTime() {
                    const localNow = new Date();
                    const localTimeStr = localNow.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    if (city) {
                        tag.innerHTML = `<span class="tag-label">CURRENT LOCATION:</span> <span class="tag-data">${city.toUpperCase()}, ${country}</span> <span class="tag-separator">|</span> <span class="tag-label">LOCAL TIME:</span> <span class="tag-data">${localTimeStr}</span>`;
                    }
                }
                // Clear any existing intervals if we had them (not applicable here as it runs once)
                setInterval(updateLocalTime, 1000);
                updateLocalTime();
            }
        }
        detectLocation();

        async function fetchWeather() {
            const query = input.value.trim();
            if(!query) return;

            // Persist searched stations
            localStorage.setItem('lastStations', query);

            cardsGrid.innerHTML = '';
            loader.style.display = 'block';
            
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.opacity = '1';
            progressBar.style.width = '30%';

            try {
                const response = await fetch(`/api/weather?stations=${encodeURIComponent(query)}`);
                progressBar.style.width = '70%';
                const data = await response.json();
                
                progressBar.style.width = '100%';
                setTimeout(() => { 
                    progressContainer.style.opacity = '0';
                    progressBar.style.width = '0%';
                }, 500);

                loader.style.display = 'none';
                createCard(data.text);
                
                // Dynamic Weather Animations
                const textRaw = data.text.toLowerCase();
                document.body.className = '';
                
                // Broaden detection for all types of rain and storm indicators
                const isThunder = textRaw.includes('thunderstorm') || textRaw.includes('thunder') || textRaw.includes(' ts') || textRaw.includes('tsra');
                const isRain = textRaw.includes('rain') || textRaw.includes('showers') || textRaw.includes('shra') || textRaw.includes('ra') || textRaw.includes('drizzle') || textRaw.includes('dz');
                const isWindy = textRaw.includes('gust') || textRaw.includes('windy') || textRaw.includes('g') && textRaw.match(/g\d{2}/);

                if (isThunder) {
                    document.body.className = 'weather-thunder';
                } else if (isRain) {
                    document.body.className = 'weather-rain';
                } else if (isWindy) {
                    document.body.className = 'weather-windy';
                } else {
                    document.body.className = 'weather-clear';
                }
                
            } catch (err) {
                loader.style.display = 'none';
                progressContainer.style.opacity = '0';
                cardsGrid.innerHTML = `<p class="error">System Error: Datalink Timeout.</p>`;
            }
        }

        btn.addEventListener('click', fetchWeather);
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') fetchWeather(); });

        // Load saved stations on page load
        const savedStations = localStorage.getItem('lastStations');
        if (savedStations) {
            input.value = savedStations;
            fetchWeather();
        }
    </script>
</body>
</html>
