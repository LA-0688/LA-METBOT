<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAM Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/static/animated-icons.js"></script>
</head>
<body>
    <canvas id="weatherCanvas" class="weather-canvas"></canvas>
    <main class="container">
        <header>
            <div class="header-main-brand" id="brand-container">
                <h1 id="main-title">
                    <span id="title-icon-left" class="brand-icon"></span>
                    <span class="highlight">MET</span>AM
                    <span id="title-icon-right" class="brand-icon"></span>
                </h1>
                <div id="utc-clock" class="utc-clock">--:--:-- UTC</div>
                <div id="location-tag" class="location-tag">Detecting Local Uplink...</div>
            </div>
            <p class="tagline">Aviation Weather Interface</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="icao-input" placeholder="Enter ICAO codes (e.g. VABB KLAX)" autocomplete="off">
                <button id="search-btn">FETCH</button>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </section>

        <section id="results" class="results-container">
            <div class="loader" id="loader"></div>
            <div id="weather-cards" class="cards-grid"></div>
        </section>
    </main>

    <!-- Modal -->
    <div id="stationModal" class="modal-overlay" onclick="if(event.target===this)closeStationModal()">
        <div class="modal-content">
            <span class="close-modal" onclick="closeStationModal()">&times;</span>
            <div id="modal-loading" class="loader" style="margin: 3rem auto;"></div>
            <div id="modal-body" style="display: none;">
                <div class="modal-header">
                    <h2 id="modal-icao">VABB</h2>
                    <p id="modal-name">Mumbai/Shivaji Intl</p>
                    <div class="modal-divider"></div>
                </div>
                
                <div class="modal-grid">
                    <div class="grid-item">
                        <div id="modal-wind-icon-container" style="margin: 0 auto; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem; transition: transform 0.5s ease-in-out;"></div>
                        <div class="grid-label">WIND</div>
                        <div class="grid-value" id="modal-wind">270° / 15 KT</div>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-eye grid-icon"></i>
                        <div class="grid-label">VISIBILITY</div>
                        <div class="grid-value" id="modal-vis">4000m</div>
                    </div>
                    <div class="grid-item">
                        <div id="modal-wx-icon" style="margin: 0 auto; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem;"></div>
                        <div class="grid-label">WEATHER</div>
                        <div class="grid-value" id="modal-wx" style="color: var(--accent-yellow);">TSRA</div>
                    </div>
                    <div class="grid-item">
                        <div id="modal-clouds-icon" style="margin: 0 auto; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem;"></div>
                        <div class="grid-label">CLOUDS</div>
                        <div class="grid-value" id="modal-clouds">SCT020</div>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-temperature-half grid-icon"></i>
                        <div class="grid-label">TEMP / DEW</div>
                        <div class="grid-value"><span id="modal-temp" style="color: #ef4444;">30°C</span> <span style="opacity: 0.5;">|</span> <span id="modal-dew" style="color: #3b82f6;">24°C</span></div>
                    </div>
                    <div class="grid-item">
                        <i class="fa-solid fa-gauge grid-icon"></i>
                        <div class="grid-label">ALTIMETER</div>
                        <div class="grid-value" id="modal-altim">Q1012 hPa</div>
                    </div>
                </div>

                <div class="modal-history">
                    <div class="history-label">RECENT REPORTS</div>
                    <div id="modal-history-list" class="history-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('icao-input');
        const btn = document.getElementById('search-btn');
        const cardsGrid = document.getElementById('weather-cards');
        const loader = document.getElementById('loader');

        // Copy raw text to clipboard
        function copyRawText(btn) {
            const block = btn.closest('.metar-block') || btn.closest('.taf-block');
            if (!block) return;
            const codeEl = block.querySelector('code');
            if (!codeEl) return;
            const rawText = codeEl.textContent.trim();
            navigator.clipboard.writeText(rawText).then(() => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                btn.style.color = '#22c55e';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-regular fa-copy"></i>';
                    btn.style.color = '';
                }, 1500);
            });
        }

        function highlightThreats(metar) {
            const criticalCodes = [
                'TS', 'RA', 'SN', 'FZ', 'WS', 'SQ', 'FC', 'SS', 'DS', 'VA', 'FG', 'BLDU', 'DZ', 'TCU', 'CU', 'CB', 'SHRA', 'MIFG'
            ];
            
            // Remove redundant METAR or TAF prefix at the start (handling any leading tags or spaces)
            const cleanMetar = metar.trim().replace(/^((?:<[^>]+>|\s)*)(METAR|TAF)\s+/, '$1');
            
            const parts = cleanMetar.split(/\s+/);
            if (parts.length <= 1) return cleanMetar;
            
            const stationCode = parts[0];
            const restOfMetar = parts.slice(1).join(' ');
            
            // 1. Highlight Weather Phenomenon (TS, FG, etc.) with optional descriptors
            const phenomRegex = new RegExp(`\\b([+-]?(?:MI|BC|PR|DR|BL|SH|TS|FZ)?(?:${criticalCodes.join('|')}))\\b`, 'g');
            let highlighted = restOfMetar.replace(phenomRegex, (match) => {
                return `<span class="metar-threat">${match}</span>`;
            });
            
            // 2. Highlight Low Visibility (ICAO 4-digit below 1000m)
            const visRegex = /\b(0\d{3})(?![Z])\b/g;
            highlighted = highlighted.replace(visRegex, '<span class="metar-threat">$1</span>');

            // 3. Highlight High/Gusty Winds (e.g., G20KT or speeds 10KT+)
            const windRegex = /\b(\d{3}(?:[1-9]\d)G?\d{0,2}KT)\b/g;
            highlighted = highlighted.replace(windRegex, '<span class="metar-threat">$1</span>');
            
            // Always highlight any wind block with a Gust (G)
            const gustyWindRegex = /\b(\d{5}G\d{2,3}KT)\b/g;
            highlighted = highlighted.replace(gustyWindRegex, '<span class="metar-threat">$1</span>');
            
            // Also catch standalone gusts if they occur
            const gustRegex = /\bG\d{2,3}KT\b/g;
            highlighted = highlighted.replace(gustRegex, '<span class="metar-threat">$1</span>');
            
            // 4. Highlight Low Cloud Base (800 feet and below)
            const cloudRegex = /\b((?:FEW|SCT|BKN|OVC|VV)00[0-8](?:CB|TCU)?)\b/g;
            highlighted = highlighted.replace(cloudRegex, '<span class="metar-threat">$1</span>');
            
            // 5. Highlight any cloud group containing CB or TCU regardless of height
            const convectiveCloudRegex = /\b([A-Z]{3}\d{3}(?:CB|TCU))\b/g;
            highlighted = highlighted.replace(convectiveCloudRegex, '<span class="metar-threat">$1</span>');
            
            return stationCode + ' ' + highlighted;
        }

        function createCardElement(result) {
            const card = document.createElement('div');
            card.className = 'weather-card';
            card.onclick = (e) => {
                const t = e.target;
                if (t.closest('.view-toggle') ||
                    t.closest('.copy-btn') ||
                    t.tagName === 'INPUT' ||
                    t.tagName === 'LABEL' ||
                    t.closest('label')) return;
                openStationModal(result.icao);
            };
            card.style.cursor = 'pointer';

            const metarTime = result.metar_time_ago || '';
            const tafTime = result.taf_time_ago || '';
            const rawMetar = result.raw_metar ? highlightThreats(result.raw_metar) : '_No METAR data available._';
            const rawTaf = result.raw_taf ? highlightThreats(result.raw_taf) : '_No TAF data available._';
            
            let displayName = result.name || "Unknown Station";
            let iataCode = "";
            const iataMatch = displayName.match(/\(([A-Z0-9]+)\)$/);
            if (iataMatch) {
                iataCode = iataMatch[1];
                displayName = displayName.replace(/\([A-Z0-9]+\)$/, '').trim();
            }

            let flightCatColor = 'inherit';
            if (result.decoded.flight_category === 'VFR') flightCatColor = '#22c55e';
            else if (result.decoded.flight_category === 'MVFR') flightCatColor = '#3b82f6';
            else if (result.decoded.flight_category === 'IFR') flightCatColor = '#ef4444';
            else if (result.decoded.flight_category === 'LIFR') flightCatColor = '#c084fc';

            card.innerHTML = `
                <div class="card-header">
                    <div class="header-left">
                        <span class="station-id">${result.icao}</span>
                        <span class="airport-name" style="font-size: 0.9rem; color: var(--text-dim); margin-top: 0.2rem;">${displayName}</span>
                        <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.1rem;">
                            ${iataCode ? `<span style="font-size: 0.8rem; font-weight: bold; color: var(--text-dim);">${iataCode}</span>` : ''}
                            <span class="airport-coords" style="font-size: 0.8rem; color: var(--text-dim); opacity: 0.7; font-family: 'JetBrains Mono', monospace;">${result.coords}</span>
                        </div>
                    </div>
                    <div class="header-center">
                        ${result.sun}
                    </div>
                    <div class="header-right">
                        <div class="view-toggle">
                            <span class="toggle-label raw-label">Raw</span>
                            <label class="switch">
                                <input type="checkbox" onchange="this.closest('.weather-card').classList.toggle('show-decoded')">
                                <span class="slider"></span>
                            </label>
                            <span class="toggle-label decoded-label">Decoded</span>
                        </div>
                    </div>
                </div>
                <div class="card-content">
                    <div class="raw-view">
                        <div class="metar-block">
                            <div class="metar-time-label" style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.3rem; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; justify-content: space-between;">METAR ${metarTime ? `(${metarTime})` : ''}<button class="copy-btn" onclick="event.stopPropagation(); copyRawText(this)" title="Copy METAR"><i class="fa-regular fa-copy"></i></button></div>
                            <code>${rawMetar}</code>
                        </div>
                        <div class="taf-block" style="margin-top: 0.5rem;">
                            <div class="taf-time-label" style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.3rem; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; justify-content: space-between;">TAF ${tafTime ? `(${tafTime})` : ''}<button class="copy-btn" onclick="event.stopPropagation(); copyRawText(this)" title="Copy TAF"><i class="fa-regular fa-copy"></i></button></div>
                            <code>${rawTaf}</code>
                        </div>
                    </div>
                    <div class="decoded-view">
                        <br><br><br>
                        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1);"></div>
                        ${result.decoded_metar ? `
                        <div class="decoded-metar">
                            <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.3rem; font-family: 'JetBrains Mono', monospace; font-weight: bold; display: flex; align-items: center; justify-content: space-between;">METAR DECODED</div>
                            🔹 <strong>Wind</strong>: ${result.decoded_metar.wind || 'N/A'}<br>
                            🔹 <strong>Visibility</strong>: ${result.decoded_metar.visibility || 'N/A'}<br>
                            🔹 <strong>Weather</strong>: ${result.decoded_metar.weather || 'NONE'}<br>
                            🔹 <strong>Clouds</strong>: ${result.decoded_metar.clouds || 'CLEAR'}<br>
                            🔹 <strong>Temp</strong>: ${result.decoded_metar.temp || 'N/A'} | <strong>Dew</strong>: ${result.decoded_metar.dew || 'N/A'}<br>
                            🔹 <strong>Altimeter</strong>: ${result.decoded_metar.altimeter || 'N/A'}<br>
                            🔹 <strong>Flight Rules</strong>: <strong style="color: ${flightCatColor};">${result.decoded_metar.flight_rules || 'N/A'}</strong>
                        </div>` : '<p><em>No METAR decode available.</em></p>'}

                        ${result.decoded_taf ? `
                        <div class="decoded-taf" style="margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid rgba(255,255,255,0.1);">
                            <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.5rem; font-family: 'JetBrains Mono', monospace; font-weight: bold; display: flex; align-items: center; justify-content: space-between;">TAF FORECAST PERIODS</div>
                            <div style="margin-bottom: 0.8rem;">
                                <strong>⏳ Initial Forecast (${result.decoded_taf.initial.period || 'N/A'}):</strong><br>
                                <div style="padding-left: 1rem; font-size: 0.9rem; margin-top: 0.2rem; line-height: 1.4;">
                                    Wind: ${result.decoded_taf.initial.wind || 'N/A'} | Vis: ${result.decoded_taf.initial.visibility || 'N/A'}<br>
                                    Wx: ${result.decoded_taf.initial.weather || 'None'} | Clouds: ${result.decoded_taf.initial.clouds || 'Clear'}
                                </div>
                            </div>
                            ${result.decoded_taf.changes.map(chg => `
                            <div style="margin-bottom: 0.8rem;">
                                <strong>⏳ ${chg.type} (${chg.period || 'N/A'}):</strong><br>
                                <div style="padding-left: 1rem; font-size: 0.9rem; margin-top: 0.2rem; line-height: 1.4;">
                                    ${chg.wind !== 'N/A' ? `Wind: ${chg.wind}<br>` : ''}
                                    ${chg.visibility !== 'N/A' ? `Vis: ${chg.visibility}<br>` : ''}
                                    ${chg.weather !== 'None' ? `Wx: ${chg.weather}<br>` : ''}
                                    ${chg.clouds !== 'Clear' ? `Clouds: ${chg.clouds}` : ''}
                                </div>
                            </div>
                            `).join('')}
                        </div>` : '<div style="margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid rgba(255,255,255,0.1);"><p><em>No TAF forecast available.</em></p></div>'}
                    </div>
                </div>
            `;
            return card;
        }

        // Modal Logic
        function openStationModal(icao) {
            const modal = document.getElementById('stationModal');
            const loader = document.getElementById('modal-loading');
            const body = document.getElementById('modal-body');
            
            modal.style.display = 'flex';
            loader.style.display = 'block';
            body.style.display = 'none';

            fetch(`/api/station?icao=${icao}`)
                .then(res => res.json())
                .then(data => {
                    loader.style.display = 'none';
                    if (data.error) {
                        alert("Could not load details for " + icao);
                        closeStationModal();
                        return;
                    }
                    body.style.display = 'block';
                    
                    document.getElementById('modal-icao').textContent = data.icao;
                    document.getElementById('modal-name').textContent = data.name.toUpperCase();
                    
                    document.getElementById('modal-wind').textContent = data.model.windStr;
                    document.getElementById('modal-vis').textContent = data.model.visibility;
                    
                    const wxText = data.model.weather || '';
                    document.getElementById('modal-wx').textContent = wxText || 'NONE';
                    const wxIcon = document.getElementById('modal-wx-icon');
                    const wxUpper = wxText.toUpperCase();
                    if (wxUpper.includes('TS')) {
                        wxIcon.innerHTML = AnimatedIcons.Thunder;
                    } else if (wxUpper.includes('SN') || wxUpper.includes('SG')) {
                        wxIcon.innerHTML = AnimatedIcons.Snow;
                    } else if (wxUpper.includes('RA') || wxUpper.includes('DZ') || wxUpper.includes('SH')) {
                        if (wxUpper.includes('+')) wxIcon.innerHTML = AnimatedIcons.HeavyRain;
                        else wxIcon.innerHTML = AnimatedIcons.Rain;
                    } else if (wxUpper.includes('FG') || wxUpper.includes('BR') || wxUpper.includes('HZ') || wxUpper.includes('FU') || wxUpper.includes('DU') || wxUpper.includes('VA') || wxUpper.includes('SA')) {
                        wxIcon.innerHTML = AnimatedIcons.Fog;
                    } else if (wxUpper.includes('FC')) {
                        wxIcon.innerHTML = AnimatedIcons.Tornado;
                    } else if (wxUpper === '') {
                        wxIcon.innerHTML = AnimatedIcons.Sun;
                    } else {
                        wxIcon.innerHTML = AnimatedIcons.Cloud;
                    }

                    const cloudsText = data.model.clouds || '';
                    document.getElementById('modal-clouds').textContent = cloudsText || 'CLEAR';
                    const cloudsIcon = document.getElementById('modal-clouds-icon');
                    const cloudsUpper = cloudsText.toUpperCase();
                    cloudsIcon.innerHTML = AnimatedIcons.getCloudOktaSVG(cloudsUpper);
                    document.getElementById('modal-temp').textContent = data.model.temp;
                    document.getElementById('modal-dew').textContent = data.model.dew;
                    document.getElementById('modal-altim').textContent = data.model.altimeter;
                    
                    // Draw and rotate wind barb
                    const windDir = parseInt(data.model.windDir) || 0;
                    const windSpeed = parseInt(data.model.windSpeed) || 0;
                    const windContainer = document.getElementById('modal-wind-icon-container');
                    windContainer.innerHTML = AnimatedIcons.getWindBarbSVG(windSpeed);
                    windContainer.style.transform = `rotate(${windDir}deg)`;

                    const histList = document.getElementById('modal-history-list');
                    histList.innerHTML = '';
                    data.history.forEach(h => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        div.innerHTML = highlightThreats(h);
                        histList.appendChild(div);
                    });
                })
                .catch(err => {
                    alert("Error loading station details.");
                    closeStationModal();
                });
        }

        function closeStationModal() {
            document.getElementById('stationModal').style.display = 'none';
        }

        // UTC Clock & Dynamic Title Logic
        let detectedCity = null;
        let detectedCountry = null;

        function updateClockAndIcons() {
            const now = new Date();
            const hours = now.getUTCHours();
            
            // 1. Update UTC Clock
            const utc = now.toISOString().split('T')[1].split('.')[0] + ' UTC';
            document.getElementById('utc-clock').textContent = utc;

            // 2. Update Local Time if location is detected
            if (detectedCity) {
                const localTimeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const tag = document.getElementById('location-tag');
                tag.innerHTML = `<span class="tag-label">CURRENT LOCATION:</span> <span class="tag-data">${detectedCity.toUpperCase()}, ${detectedCountry}</span> <span class="tag-separator">|</span> <span class="tag-label">LOCAL TIME:</span> <span class="tag-data">${localTimeStr}</span>`;
            }

            const iconLeft = document.getElementById('title-icon-left');
            const iconRight = document.getElementById('title-icon-right');

            // Time of day logic
            if (hours >= 5 && hours < 11) {
                iconLeft.textContent = '🌅'; // Sunrise
                iconRight.textContent = '☁️';
            } else if (hours >= 11 && hours < 17) {
                iconLeft.textContent = '☀️'; // Noon
                iconRight.textContent = '🌤️';
            } else if (hours >= 17 && hours < 20) {
                iconLeft.textContent = '🌇'; // Sunset
                iconRight.textContent = '🌆';
            } else {
                iconLeft.textContent = '🌙'; // Night
                iconRight.textContent = '✨';
            }
        }
        setInterval(updateClockAndIcons, 1000);
        updateClockAndIcons();

        // Location & Local Time Detection
        async function detectLocation() {
            const tag = document.getElementById('location-tag');
            
            // Try HTML5 Geolocation first (more accurate, bypasses VPN)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const resp = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                        const data = await resp.json();
                        const city = data.locality || data.city || data.principalSubdivision || "Unknown";
                        const country = data.countryCode || "??";
                        setupClock(city, country);
                    } catch (err) {
                        fallbackToIP();
                    }
                }, (err) => {
                    // Fallback if user denies or it fails
                    fallbackToIP();
                }, { timeout: 5000 });
            } else {
                fallbackToIP();
            }

            async function fallbackToIP() {
                try {
                    const resp = await fetch('https://ipapi.co/json/');
                    const data = await resp.json();
                    setupClock(data.city, data.country_code);
                } catch (err) {
                    tag.textContent = 'CURRENT LOCATION: OFFLINE';
                }
            }

            function setupClock(city, country) {
                detectedCity = city;
                detectedCountry = country;
                updateClockAndIcons(); // Update immediately with new location
            }
        }
        detectLocation();

        async function fetchWeather() {
            const query = input.value.trim();
            if(!query) return;

            localStorage.setItem('lastStations', query);
            cardsGrid.innerHTML = '';
            
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.opacity = '1';
            progressBar.style.width = '10%';

            let rawStations = query.replace(",", " ").split(/\s+/).filter(s => s.trim());
            const stations = [...new Set(rawStations.map(s => s.toUpperCase()))];
            const queryStr = stations.join(',');
            
            const placeholders = [];
            stations.forEach(station => {
                const stationUpper = station.toUpperCase();
                const placeholder = document.createElement('div');
                placeholder.className = 'weather-card';
                placeholder.innerHTML = `
                    <div class="card-header">
                        <div class="header-left">
                            <span class="station-id">${stationUpper}</span>
                            <span class="airport-name">Connecting...</span>
                        </div>
                    </div>
                    <div style="color: var(--text-dim); font-size: 0.9rem;">Fetching live data from uplink...</div>
                `;
                cardsGrid.appendChild(placeholder);
                placeholders.push({ icao: stationUpper, element: placeholder });
            });

            progressBar.style.width = '50%';

            try {
                const response = await fetch(`/api/weather?stations=${queryStr}`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    let hasThunder = false;
                    let hasRain = false;
                    
                    placeholders.forEach(({ icao, element }) => {
                        const result = data.results[icao];
                        
                        if (result && !result.error) {
                            const realCard = createCardElement(result);
                            element.replaceWith(realCard);
                            
                            const wxRaw = (result.decoded.weather || '').toLowerCase();
                            if (wxRaw.includes('ts')) hasThunder = true;
                            if (wxRaw.includes('ra') || wxRaw.includes('dz') || wxRaw.includes('sh')) hasRain = true;
                        } else {
                            element.innerHTML = `
                                <div class="card-header">
                                    <div class="header-left">
                                        <span class="station-id">${icao}</span>
                                        <span class="airport-name" style="color: #ef4444;">No Data</span>
                                    </div>
                                </div>
                                <div style="color: var(--text-dim); font-size: 0.9rem;">${result ? result.error : 'Data unavailable'}</div>
                            `;
                        }
                    });

                    if (hasThunder) document.body.className = 'weather-thunder';
                    else if (hasRain) document.body.className = 'weather-rain';
                    else document.body.className = '';
                } else {
                    throw new Error(data.message || 'API Error');
                }
            } catch (err) {
                placeholders.forEach(({ icao, element }) => {
                    if (document.body.contains(element)) {
                        element.innerHTML = `
                            <div class="card-header">
                                <div class="header-left">
                                    <span class="station-id">${icao}</span>
                                    <span class="airport-name" style="color: #ef4444;">Uplink Failed</span>
                                </div>
                            </div>
                            <div style="color: var(--text-dim); font-size: 0.9rem;">Unable to retrieve data.</div>
                        `;
                    }
                });
            } finally {
                progressBar.style.width = '100%';
                setTimeout(() => progressContainer.style.opacity = '0', 500);
            }
        }

        btn.addEventListener('click', fetchWeather);
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') fetchWeather(); });

        // Load saved stations on page load
        const savedStations = localStorage.getItem('lastStations');
        if (savedStations) {
            input.value = savedStations;
            fetchWeather();
        }

        // ==========================================
        // DYNAMIC RAIN & WIND ANIMATION (CANVAS)
        // ==========================================
        const canvas = document.getElementById('weatherCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                this.length = Math.random() * 20 + 10;
                this.speed = Math.random() * 15 + 15; // Rain falling speed
                this.wind = Math.random() * 5 + 5; // Wind blowing right
                this.opacity = Math.random() * 0.4 + 0.1;
                this.thickness = Math.random() * 2 + 1;
            }

            update() {
                this.y += this.speed;
                this.x += this.wind; // Apply wind force

                if (this.y > height || this.x > width) {
                    this.reset();
                    this.y = -this.length; // Start from top
                    this.x = Math.random() * width - 200; // Account for wind push
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                // Draw line accounting for wind angle
                ctx.lineTo(this.x - (this.wind * this.length/this.speed), this.y - this.length);
                ctx.strokeStyle = `rgba(186, 230, 253, ${this.opacity})`;
                ctx.lineWidth = this.thickness;
                ctx.stroke();
            }
        }

        // Create rain particles
        for (let i = 0; i < 300; i++) {
            particles.push(new Particle());
        }

        function animate() {
            // Clear canvas instead of redrawing background to allow underlying CSS background to show
            ctx.clearRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
