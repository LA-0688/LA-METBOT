<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Animation Mock</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .metar-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 12px;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            text-align: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        h1 {
            margin-top: 0;
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
        }

        .weather-text {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .threat {
            font-weight: 800;
            color: #eab308;
        }
    </style>
</head>
<body>

    <canvas id="weatherCanvas"></canvas>

    <div class="metar-card">
        <h1>VABB 181700Z</h1>
        <p class="weather-text">
            29007KT 4000 HZ BR SCT020 BECMG 1821/1823 VRB03KT 3000 BR HZ FEW020 SCT025 BKN100<br><br>
            <span style="font-size: 0.9em; color: #94a3b8;">* Rain and wind animation preview rendered in background *</span>
        </p>
    </div>

    <script>
        const canvas = document.getElementById('weatherCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                this.length = Math.random() * 20 + 10;
                this.speed = Math.random() * 15 + 15; // Rain falling speed
                this.wind = Math.random() * 5 + 5; // Wind blowing right
                this.opacity = Math.random() * 0.4 + 0.1;
                this.thickness = Math.random() * 2 + 1;
            }

            update() {
                this.y += this.speed;
                this.x += this.wind; // Apply wind force

                if (this.y > height || this.x > width) {
                    this.reset();
                    this.y = -this.length; // Start from top
                    this.x = Math.random() * width - 200; // Account for wind push
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                // Draw line accounting for wind angle
                ctx.lineTo(this.x - (this.wind * this.length/this.speed), this.y - this.length);
                ctx.strokeStyle = `rgba(186, 230, 253, ${this.opacity})`;
                ctx.lineWidth = this.thickness;
                ctx.stroke();
            }
        }

        // Create rain particles
        for (let i = 0; i < 300; i++) {
            particles.push(new Particle());
        }

        function animate() {
            // Semi-transparent black to create motion blur effect
            ctx.fillStyle = 'rgba(15, 23, 42, 0.3)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
